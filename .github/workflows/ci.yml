name: Orcestr Core quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Test
        run: uv run pytest -q
        working-directory: backend
      - name: Build wheel and source distribution
        run: uv build
        working-directory: backend
      - name: Verify the built wheel in a clean environment
        working-directory: backend
        run: |
          uv venv .package-smoke
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python .package-smoke/bin/python "${wheel}[fastapi]"
          uv pip check --python .package-smoke/bin/python
          .package-smoke/bin/python -c "import orcestr_core; import orcestr_core.fastapi"

  frontend:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Test and build
        run: npm test
        working-directory: frontend
      - name: Inspect package contents
        run: npm run pack:dry-run
        working-directory: frontend
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
